# Define el bloque de eventos (requerido por Nginx)
events {
    worker_connections 1024;  # Ajusta según sea necesario
}

# Define el bloque HTTP
http {
    # Define un bloque de servidor
    server {
        # Escucha en el puerto 80 (HTTP)
        listen 80;

        # Define la raíz del servidor (donde están los archivos que quieres servir)
        root /usr/share/nginx/html;

        # Define el archivo de índice por defecto
        index index.html index.htm;

        # Configuración para manejar solicitudes
        location / {
            # Intenta servir el archivo solicitado, si no existe, muestra un error 404
            try_files $uri $uri/ =404;
        }

        # Manejo de errores personalizados (opcional)
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Configuración para archivos CSS
        location ~* \.css$ {
            # Asegúrate de que el tipo MIME sea correcto
            default_type text/css;
        }
    }
}